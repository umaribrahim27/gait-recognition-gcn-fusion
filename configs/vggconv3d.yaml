# VGGConv3D branch training config.
# Hyperparameters taken from the paper's Sec. 4.2 (Implementation Details)
# where stated; model dims (conv channel widths) are inferred defaults
# (see README).

model:
  in_channels: 3
  channels: [64, 128, 256, 512]
  embedding_size: 128

data:
  sequence_length: 59        # T, paper Sec. 4.2
  frame_size: [80, 80]        # paper Sec. 3.1

optim:
  name: adam
  schedule: one_cycle
  max_lr: 0.0001              # paper Sec. 4.2
  epochs: 200                  # paper Sec. 4.2
  batch_size: 128              # paper Sec. 4.2

loss:
  name: supervised_contrastive
  temperature: 0.01            # paper Sec. 4.2
